<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AmraniAds — Admin</title>
  <link rel="icon" href="/assets/brand/amraniads-icon.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --g-500:#22c55e;--g-600:#16a34a;--g-tint:#dcfce7;
      --d-800:#061a12;--bg:#f4f8f6;--surface:#fff;
      --text:#0b1f18;--muted:#5d7169;--border:#e2ebe6;
      --r-md:16px;--r-lg:22px;
      --shadow-md:0 10px 34px rgba(6,26,18,.09);
      --shadow-lg:0 26px 70px rgba(6,26,18,.14);
      --ease:cubic-bezier(.22,.9,.3,1);
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    h1,h2,h3{font-family:'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em}

    /* ---------- LOGIN ---------- */
    #loginScreen{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--d-800);padding:20px;position:relative;overflow:hidden;
    }
    #loginScreen::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(55% 55% at 50% 0%,rgba(34,197,94,.28),transparent 65%);
    }
    .login-card{
      background:var(--surface);border-radius:var(--r-lg);padding:38px 32px;
      max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow-lg);position:relative;
    }
    .login-logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:6px}
    .login-logo span{color:var(--g-600)}
    .login-badge{
      display:inline-block;background:var(--g-tint);color:var(--g-600);
      font-size:.74rem;font-weight:800;padding:5px 13px;border-radius:50px;margin-bottom:22px;
    }
    .login-input{
      width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:12px;
      font-size:16px;font-family:inherit;outline:none;margin-bottom:12px;background:var(--bg);
      transition:border-color .2s var(--ease);
    }
    .login-input:focus{border-color:var(--g-500)}
    .login-btn{
      width:100%;background:linear-gradient(135deg,var(--g-500),var(--g-600));color:#fff;
      border:none;border-radius:12px;padding:13px;font-family:inherit;font-weight:800;font-size:.94rem;
      cursor:pointer;transition:transform .2s var(--ease);
    }
    .login-btn:hover{transform:translateY(-1px)}
    .login-err{color:#dc2626;font-size:.8rem;font-weight:600;margin-top:10px;display:none}

    /* ---------- APP ---------- */
    #app{display:none;max-width:640px;margin:0 auto;padding:36px 20px 60px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:9px}
    .brand img{height:28px;width:auto}
    .brand span{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1rem}
    .brand span b{color:var(--g-600)}
    .logout{
      background:var(--surface);border:1.5px solid var(--border);color:var(--muted);
      font-family:inherit;font-weight:700;font-size:.8rem;padding:8px 16px;border-radius:50px;cursor:pointer;
    }
    .logout:hover{border-color:var(--muted);color:var(--text)}

    .card{
      background:var(--surface);border:1.5px solid #86efac;border-radius:var(--r-lg);
      padding:26px 24px;box-shadow:var(--shadow-md);
    }
    .card h2{font-size:1.1rem;margin-bottom:6px}
    .card p.hint{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:20px}

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .f{margin-bottom:14px}
    .f label{display:block;font-size:.78rem;font-weight:700;color:#166534;margin-bottom:5px}
    .f label .opt{color:var(--muted);font-weight:400}
    .f input{
      width:100%;border:1.5px solid #86efac;border-radius:10px;padding:11px 13px;
      font-family:inherit;font-size:.9rem;color:var(--text);background:var(--bg);outline:none;
      transition:border-color .2s var(--ease);
    }
    .f input:focus{border-color:var(--g-500)}

    .genBtn{
      background:linear-gradient(135deg,var(--g-500),var(--g-600));color:#fff;border:none;
      border-radius:50px;padding:13px 26px;font-family:inherit;font-size:.94rem;font-weight:800;
      cursor:pointer;width:100%;transition:transform .2s var(--ease),box-shadow .2s var(--ease);
      box-shadow:0 10px 26px rgba(34,197,94,.28);
    }
    .genBtn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(34,197,94,.38)}

    #result{display:none;margin-top:22px}
    #result label{display:block;font-size:.76rem;font-weight:700;color:#166534;margin-bottom:6px}
    .urlRow{display:flex;gap:8px;align-items:flex-start;margin-bottom:16px}
    .urlRow textarea{
      flex:1;border:1.5px solid #86efac;border-radius:10px;padding:11px 13px;
      font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--text);
      background:#f0fdf4;outline:none;resize:none;word-break:break-all;
    }
    .copyBtn{
      background:var(--g-tint);border:1px solid #86efac;color:#166534;border-radius:8px;
      padding:11px 15px;cursor:pointer;font-size:.8rem;font-weight:700;white-space:nowrap;
      font-family:inherit;transition:background .2s var(--ease);
    }
    .copyBtn:hover{background:#bbf7d0}
    .waBox{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:16px}
    .waBox .lbl{font-size:.8rem;font-weight:700;color:#166534;margin-bottom:8px}
    .waBox pre{
      font-family:inherit;font-size:.83rem;color:#374151;line-height:1.7;
      white-space:pre-wrap;word-break:break-word;margin-bottom:10px;
    }
    .waCopy{
      background:#25D366;color:#fff;border:none;border-radius:50px;padding:8px 20px;
      font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;
    }

    #toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--d-800);color:#fff;padding:12px 24px;border-radius:50px;
      font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;z-index:500;
      transition:opacity .3s var(--ease),transform .3s var(--ease);
      border:1px solid rgba(52,211,153,.35);box-shadow:0 12px 36px rgba(0,0,0,.3);
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:520px){.row2{grid-template-columns:1fr}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Amrani<span>Ads</span></div>
    <div class="login-badge">🔒 Admin</div>
    <input type="password" id="pwInput" class="login-input" placeholder="Mot de passe admin" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Accéder →</button>
    <div class="login-err" id="loginErr">Mot de passe incorrect</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top">
    <div class="brand">
      <img src="/assets/brand/amraniads-icon.png" alt="AmraniAds"/>
      <span>amrani<b>ads</b></span>
    </div>
    <button class="logout" onclick="doLogout()">↩ Déconnexion</button>
  </div>

  <div class="card">
    <h2>🧾 Lien du brief de création</h2>
    <p class="hint">Pour un client qui a déjà payé/validé : il remplit les couleurs, le nom de marque, l'adresse, les produits… et tout arrive sur le bot Telegram « brief ».</p>

    <div class="row2">
      <div class="f">
        <label>Nom du client</label>
        <input id="bg-name" type="text" placeholder="ex: Yassine El Idrissi"/>
      </div>
      <div class="f">
        <label>Réf. / ID <span class="opt">(optionnel)</span></label>
        <input id="bg-id" type="text" placeholder="ex: ye-2026-07"/>
      </div>
    </div>
    <div class="f">
      <label>Formule choisie <span class="opt">(optionnel)</span></label>
      <input id="bg-plan" type="text" placeholder="ex: Premium custom store + CRM"/>
    </div>

    <button class="genBtn" onclick="generateBriefLink()">🧾 Générer le lien du brief</button>

    <div id="result">
      <label>Lien personnalisé</label>
      <div class="urlRow">
        <textarea id="bg-url" readonly rows="2"></textarea>
        <button class="copyBtn" onclick="copyField('bg-url')">📋 Copier</button>
      </div>
      <div class="waBox">
        <div class="lbl">💬 Message WhatsApp</div>
        <pre id="bg-wa-msg"></pre>
        <button class="waCopy" onclick="copyField('bg-wa-msg',true)">💬 Copier le message</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const DEFAULT_PW = 'amrani2025admin';

function doLogin(){
  const v = document.getElementById('pwInput').value;
  const stored = localStorage.getItem('admin_pw') || DEFAULT_PW;
  if (v === stored){
    sessionStorage.setItem('admin_ok','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    document.getElementById('loginErr').style.display='block';
  }
}
function doLogout(){
  sessionStorage.removeItem('admin_ok');
  location.reload();
}
(function(){
  if (sessionStorage.getItem('admin_ok') === '1'){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
  }
})();

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
function copyField(id,isText){
  const el=document.getElementById(id);
  const txt=isText?el.textContent:el.value;
  navigator.clipboard.writeText(txt).then(()=>toast('✅ Copié !'));
}

// ── BRIEF LINK GENERATOR ─────────────────────────────────────
function generateBriefLink(){
  const name = document.getElementById('bg-name').value.trim();
  const id   = document.getElementById('bg-id').value.trim();
  const plan = document.getElementById('bg-plan').value.trim();
  if (!name){ toast('⚠️ Entrez le nom du client'); return; }

  const cfg = { n:name };
  if (id)   cfg.id = id;
  if (plan) cfg.p  = plan;

  const code = btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
  const url  = 'https://amraniads.com/brief/?c=' + encodeURIComponent(code);

  const waMsg =
`Bonjour ${name} 👋

Pour lancer la création de votre boutique, remplissez ce petit formulaire (environ 7 minutes) :

🔗 ${url}

Vous y indiquez :
• le nom et les couleurs de votre marque
• vos coordonnées et réseaux
• vos produits, paiements et livraison
• le style de design que vous aimez

💡 Vos réponses s'enregistrent automatiquement — vous pouvez fermer et reprendre plus tard.

📎 Ensuite, envoyez-nous ici votre logo et vos photos produits.

— AmraniAds`;

  document.getElementById('bg-url').value = url;
  document.getElementById('bg-wa-msg').textContent = waMsg;
  document.getElementById('result').style.display = 'block';
  toast('✅ Lien du brief généré');
}
</script>
</body>
</html>
